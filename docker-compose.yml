# Lokalny stack dev CRM (Docker). Porty niestandardowe — brak kolizji z innymi projektami.
#
#   docker compose up -d                  → sama INFRA (MySQL + MinIO).
#                                           Backend i frontend uruchamiasz z IntelliJ
#                                           (profil dev łączy się z MySQL na :13306, S3 na :19910).
#   docker compose --profile app up -d --build
#                                         → WSZYSTKO w Dockerze (infra + backend + frontend).
#
# Baza startuje pusta — schemat tworzy Hibernate (ddl-auto=update w profilu dev).
name: crm

services:
  # ---------- INFRA (zawsze) ----------
  crm-mysql:
    image: mysql:8.0
    container_name: crm-mysql
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"   # root bez hasła — zgodnie z profilem dev
      MYSQL_DATABASE: crm_dev
    ports:
      - "13306:3306"
    volumes:
      - crm-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

  crm-minio:
    # S3 zgodne z MinIO (obrazy MinIO zniknęły z quay.io i Docker Hub). Port 19910, bo 19900 zajmuje streetcom-s3.
    image: chrislusf/seaweedfs:4.53
    container_name: crm-s3
    command: ["server", "-dir=/data", "-s3"]
    ports:
      - "19910:8333"   # S3 API
    volumes:
      - crm-s3-data:/data

  crm-gotenberg:
    # HTML → PDF (Chromium) dla automatycznej oferty. Na Railway: osobny serwis z tego obrazu + env GOTENBERG_URL w backendzie.
    image: gotenberg/gotenberg:8
    container_name: crm-gotenberg
    ports:
      - "13000:3000"

  # ---------- APLIKACJA (profil `app`) ----------
  crm-backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      DB_HOST: crm-mysql
      DB_PORT: "3306"
      # MinIO: endpoint wewnętrzny (sieć kontenerów), public-url widoczny z przeglądarki
      MINIO_ENDPOINT: http://crm-minio:8333
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: crm-uploads
      MINIO_PUBLIC_URL: http://localhost:19910
      GOTENBERG_URL: http://crm-gotenberg:3000
    ports:
      - "18080:8080"
    depends_on:
      crm-mysql:
        condition: service_healthy
      crm-minio:
        condition: service_started

  crm-frontend:
    profiles: ["app"]
    build:
      context: ../crm-frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: http://localhost:18080
    container_name: crm-frontend
    ports:
      - "18088:3000"
    depends_on:
      - crm-backend

volumes:
  crm-mysql-data:
  crm-s3-data:
