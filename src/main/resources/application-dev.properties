
# Konfiguracja bazy danych dla dev — MySQL w Dockerze (docker compose up) na porcie 13306.
# DB_HOST/DB_PORT nadpisywane w kontenerze backendu (crm-mysql:3306).
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/crm_dev
spring.datasource.username=root
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=false

# Poziomy logowania
logging.level.org.quartz=DEBUG
logging.level.org.springframework.scheduling.quartz=DEBUG
logging.level.org.flywaydb=ERROR
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
# Diagnoza CORS — pokaże powód ew. odrzucenia 403 ("Invalid CORS request" + origin)
logging.level.org.springframework.web.cors=TRACE
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.security.web=DEBUG
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Inne ustawienia
spring.datasource.hikari.data-source-properties.serverTimezone=Europe/Warsaw
# Port niestandardowy — unika kolizji z drugą lokalną aplikacją na 8080.
server.port=${SERVER_PORT:18080}

# MinIO (dev) — lokalny MinIO z docker compose (:19900). Nadpisywane env-ami w kontenerze backendu.
minio.endpoint=${MINIO_ENDPOINT:http://localhost:19900}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.bucket=${MINIO_BUCKET:crm-uploads}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:19900}

