# Konfiguracja bazy danych dla produkcji (Railway MySQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.hibernate.ddl-auto=update
server.port=${PORT:8080}
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql=ERROR

# ===== Poczta (SMTP) — sekrety WYŁĄCZNIE z env w Railway =====
# Ustaw: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD, MAIL_FROM
# Bez SPRING_MAIL_HOST poczta jest WYŁĄCZONA (bean EmailService/JavaMailSender się nie tworzy) — start bez zmian.
spring.mail.from=${MAIL_FROM:powiadomienia@whplus.com.pl}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Bazowy URL CRM do linków w mailach powiadomień.
app.crm.base-url=${CRM_BASE_URL:https://crm.w-h.pl}
