

spring.application.name=crm
# Opcjonalny lokalny plik z sekretami/nadpisaniami (gitignored); na Railway nie istnieje -> pomijany
spring.config.import=optional:file:./local.properties
spring.jackson.time-zone=Europe/Warsaw
spring.datasource.hikari.data-source-properties.serverTimezone=Europe/Warsaw
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=TRACE

# Mail - wyłączone
#spring.mail.from=powiadomienia@whplus.com.pl
#spring.mail.host=smtp.mailtrap.io
#spring.mail.port=587
#spring.mail.username=
#spring.mail.password=
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
# SMS API — token WYŁĄCZNIE z env (SMSAPI_TOKEN). Pusty default => brak sekretu w repo.
# Uwaga: poprzedni token wyciekł do historii gita — ZROTUJ go i ustaw nowy w Railway/env.
smsapi.token=${SMSAPI_TOKEN:}
smsapi.sender=${SMSAPI_SENDER:Test}

# MinIO Configuration
# MinIO — dane dostępowe WYŁĄCZNIE z env. Puste defaulty => brak sekretu w repo.
# Uwaga: poprzedni klucz wyciekł do historii gita — ZROTUJ go i ustaw nowy w Railway/env.
minio.endpoint=${MINIO_ENDPOINT:https://media.w-h.pl}
minio.access-key=${MINIO_ACCESS_KEY:}
minio.secret-key=${MINIO_SECRET_KEY:}
minio.bucket=${MINIO_BUCKET:crm-uploads}
minio.public-url=${MINIO_PUBLIC_URL:https://media.w-h.pl}
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=150MB

# reCAPTCHA v3 — gdy klucz nie ustawiony, weryfikacja jest pomijana (honeypot + rate-limit pokrywają).
# W produkcji ustaw RECAPTCHA_SECRET_KEY w Railway (Settings → Variables).
recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
recaptcha.min-score=${RECAPTCHA_MIN_SCORE:0.5}

# CORS — lista originów jako CSV. W produkcji nadpisz CORS_ALLOWED_ORIGINS w Railway.
# Default: domeny WH-Plus + localhost:3000 dla dev. Brak * (allowCredentials=true tego zabrania).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://calm-river-05548b403.4.azurestaticapps.net,http://localhost,http://localhost:*,http://127.0.0.1,http://127.0.0.1:*,https://whplus.com.pl,https://w-h.pl,https://crm.w-h.pl,https://wyposazenie-hotelowe.pl,https://www.wyposazenie-hotelowe.pl}

# Fakturownia integration (read-only sync)
fakturownia.sync.cron=${FAKTUROWNIA_SYNC_CRON:0 */15 * * * ?}
# period: this_month | this_year | last_year | all
# UWAGA: "more" w Fakturowni wymaga dodatkowo date_from i date_to — bez nich
# zwraca pustą listę, dlatego defaultem jest "this_year".
# Dla projektów wieloletnich można ustawić "all" przez env var.
fakturownia.sync.period=${FAKTUROWNIA_SYNC_PERIOD:this_year}
fakturownia.api.base-url-template=${FAKTUROWNIA_BASE_URL_TEMPLATE:https://%s.fakturownia.pl}

# SharePoint / Microsoft Graph (read-only — listujemy i linkujemy pliki, nie wgrywamy).
# Ustaw w Railway/env: tenant, client id+secret (App registration), URL witryny SharePoint.
# Bez tych wartości integracja jest wyłączona (endpointy zwracają jasny komunikat).
sharepoint.tenant-id=${SHAREPOINT_TENANT_ID:}
sharepoint.client-id=${SHAREPOINT_CLIENT_ID:}
sharepoint.client-secret=${SHAREPOINT_CLIENT_SECRET:}
sharepoint.site-url=${SHAREPOINT_SITE_URL:}
sharepoint.graph-base-url=${SHAREPOINT_GRAPH_BASE_URL:https://graph.microsoft.com/v1.0}
sharepoint.login-base-url=${SHAREPOINT_LOGIN_BASE_URL:https://login.microsoftonline.com}

# Dify (agenci AI) — prod: ustaw DIFY_BASE_URL na sieć prywatną Railway (http://dify-api.railway.internal/v1)
dify.base-url=${DIFY_BASE_URL:https://api.agent.w-h.pl/v1}
# Klucze agentów Dify — ustaw jako zmienne środowiskowe (Railway/local.properties), NIE commituj
dify.agent-keys.meble-wspolne=${DIFY_MEBLE_WSPOLNE_KEY:}
dify.agent-keys.meble-skrzyniowe=${DIFY_MEBLE_SKRZYNIOWE_KEY:}
dify.agent-keys.porownanie-ofert=${DIFY_POROWNANIE_OFERT_KEY:}
# Asystent AI — czaty (jeden model na czat). Klucze z env (Railway) / local.properties (dev).
dify.agent-keys.asystent-claude=${DIFY_KEY_CLAUDE:}
dify.agent-keys.asystent-chatgpt=${DIFY_KEY_CHATGPT:}
dify.agent-keys.asystent-gemini=${DIFY_KEY_GEMINI:}
# Prefiks identyfikatora usera do Dify: <prefix>:<userId> (oddziela prod/staging).
dify.user-prefix=${DIFY_USER_PREFIX:wh-crm-prod}

